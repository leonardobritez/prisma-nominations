server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: nomination-worker
  profiles:
    default: mock-abm
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nominations}
    username: ${DB_USER:prisma}
    password: ${DB_PASSWORD:prisma}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      abm:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 80
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 5
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        record-exceptions:
          - com.prisma.nominations.worker.abm.AbmTechnicalException
        ignore-exceptions:
          - com.prisma.nominations.worker.abm.AbmFunctionalException

app:
  abm:
    base-url: ${ABM_BASE_URL:http://localhost:8082}
    timeout: ${ABM_TIMEOUT:3s}
    max-attempts: ${ABM_MAX_ATTEMPTS:4}
    wait-window: ${ABM_WAIT_WINDOW:30s}
    batch-size: ${WORKER_BATCH_SIZE:50}
    backoff-base: ${ABM_BACKOFF_BASE:2s}
    mock-callback-delay: ${ABM_MOCK_DELAY:300ms}
    callback-token: ${ABM_CALLBACK_TOKEN:}
  worker:
    dispatch-interval-ms: ${DISPATCH_INTERVAL_MS:1000}
    recovery-interval-ms: ${RECOVERY_INTERVAL_MS:5000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.prisma.nominations: DEBUG
