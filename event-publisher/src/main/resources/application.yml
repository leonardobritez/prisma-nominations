server:
  port: 8083
  shutdown: graceful

spring:
  application:
    name: event-publisher
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nominations}
    username: ${DB_USER:prisma}
    password: ${DB_PASSWORD:prisma}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

app:
  publisher:
    topic: ${PUBLISHER_TOPIC:prisma.nominations.result.v1}
    dlq-topic: ${PUBLISHER_DLQ_TOPIC:prisma.nominations.result.v1.dlq}
    interval-ms: ${PUBLISHER_INTERVAL_MS:1000}
    recovery-interval-ms: ${PUBLISHER_RECOVERY_INTERVAL_MS:10000}
    batch-size: ${PUBLISHER_BATCH_SIZE:50}
    max-attempts: ${PUBLISHER_MAX_ATTEMPTS:5}
    backoff: ${PUBLISHER_BACKOFF:5s}
    stuck-threshold: ${PUBLISHER_STUCK_THRESHOLD:60s}
    confirm-timeout: ${PUBLISHER_CONFIRM_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.prisma.nominations: DEBUG
