server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: nomination-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/nominations}
    username: ${DB_USER:prisma}
    password: ${DB_PASSWORD:prisma}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  jackson:
    default-property-inclusion: non_null
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

app:
  idempotency:
    ttl-hours: ${IDEMPOTENCY_TTL_HOURS:24}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    requests-per-minute: ${RATE_LIMIT_RPM:120}
  security:
    enabled: ${SECURITY_ENABLED:true}
    token: ${API_TOKEN:dev-token}
    authority: ROLE_NOMINATION_WRITER

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  level:
    root: INFO
    com.prisma.nominations: DEBUG
