spring:
  datasource:
    url: jdbc:h2:mem:apitest;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  flyway:
    enabled: false

app:
  security:
    enabled: false
  rate-limit:
    enabled: false
  idempotency:
    ttl-hours: 24

management:
  tracing:
    enabled: false
  otlp:
    tracing:
      export:
        enabled: false
